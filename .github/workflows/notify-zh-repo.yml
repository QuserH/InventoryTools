name: notify-zh-repo

on:
  workflow_dispatch:
  push:
    branches:
      - zh-cn-translation

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rebuild to zh-repo
        env:
          ZH_REPO_TOKEN: ${{ secrets.ZH_REPO_TOKEN }}
        run: |
          if [ -z "$ZH_REPO_TOKEN" ]; then
            echo "::error::Missing repository secret ZH_REPO_TOKEN."
            exit 1
          fi

          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" -X POST \
            -H "Authorization: Bearer $ZH_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/QuserH/zh-repo/dispatches \
            -d '{"event_type":"rebuild-inventorytools"}'
          )

          if [ "$status" != "204" ]; then
            cat response.json
            echo "::error::zh-repo dispatch failed with HTTP $status. ZH_REPO_TOKEN needs access to QuserH/zh-repo."
            exit 1
          fi
