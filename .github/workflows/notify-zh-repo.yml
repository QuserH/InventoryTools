name: notify-zh-repo

on:
  push:
    branches:
      - zh-cn-translation

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rebuild to zh-repo
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ZH_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/QuserH/zh-repo/dispatches \
            -d '{"event_type":"rebuild-zh"}'
